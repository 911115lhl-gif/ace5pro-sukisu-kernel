name: ace5pro-b16-sukisu-susfs-kpm

# Builds a GKI kernel with SukiSU Ultra + SUSFS + KPM for the OnePlus Ace 5 Pro
# (PKR110 / sun / sm8750 / 4K pages / Android 16 / 6.6.118).
#
# The layout follows the known-working flow used by giang/OnePlus-Suki-Ultra-SUSFS-Actions:
# the KernelSU integration and the SUSFS patches all go into kernel_platform/common
# (the real GKI kernel tree), NOT into msm-kernel (the vendor tree). Building
# msm-kernel produced images that could not boot even with KernelSU disabled, because
# msm-kernel is not the GKI kernel the bootloader expects.
#
# Final kernel also gets the SuKiSU KernelPatch binary pass (kptools patch_linux),
# which is what injects the hook table the manager talks to.

on:
  workflow_dispatch:
    inputs:
      CPU:
        description: "platform (only sm8750)"
        required: true
        default: "sm8750"
        type: choice
        options:
          - sm8750
      FEIL:
        description: "manifest target (only oneplus_ace5_pro_b)"
        required: true
        default: "oneplus_ace5_pro_b"
        type: choice
        options:
          - oneplus_ace5_pro_b
      ENABLE_KPM:
        description: "enable KPM"
        required: true
        default: true
        type: boolean
      ENABLE_SUSFS:
        description: "enable SUSFS"
        required: true
        default: true
        type: boolean
      ENABLE_HMBIRD_FIX:
        description: "apply HMBIRD OGKI->GKI DT fix (required to boot on Ace 5 Pro)"
        required: true
        default: true
        type: boolean
      ENABLE_KERNEL_PATCH:
        description: "run the SukiSU KernelPatch binary pass on the built Image"
        required: true
        default: true
        type: boolean
      KERNEL_LOCALVERSION:
        description: "CONFIG_LOCALVERSION suffix (must match stock for vendor_dlkm)"
        required: true
        default: "-g93e223c276e7-abogki500782043-4k"
      DRY_RUN:
        description: "stop before compiling (patch/wiring checks only)"
        required: true
        default: false
        type: boolean

concurrency:
  group: ace5pro-b16-${{ github.ref }}
  cancel-in-progress: true

env:
  MANIFEST: oneplus_ace5_pro_b.xml
  MANIFEST_BRANCH: oneplus/sm8750
  ANDROID_VERSION: android15
  KVERSION: "6.6"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: guard_params
        run: |
          echo "target=${{ inputs.FEIL }} cpu=${{ inputs.CPU }}"
          echo "KPM=${{ inputs.ENABLE_KPM }} SUSFS=${{ inputs.ENABLE_SUSFS }}"
          echo "HMBIRD=${{ inputs.ENABLE_HMBIRD_FIX }} KERNELPATCH=${{ inputs.ENABLE_KERNEL_PATCH }}"
          echo "LOCALVERSION=${{ inputs.KERNEL_LOCALVERSION }}"
          short=$(echo "${GITHUB_SHA}" | cut -c1-8)
          echo "SHORT_SHA=$short" >> "$GITHUB_ENV"
          echo "BUILDDATE=$(date +'%Y%m%d')" >> "$GITHUB_ENV"

      - name: install_repo
        run: |
          git config --global user.name  "ace5pro-ci"
          git config --global user.email "ace5pro-ci@users.noreply.github.com"
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl git make python3 zip unzip \
            device-tree-compiler bc bison flex libssl-dev libelf-dev ccache || true
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > /tmp/repo
          chmod a+x /tmp/repo
          sudo mv /tmp/repo /usr/local/bin/repo
          repo --version | head -2 || true

      - name: free_disk_space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift || true
          sudo apt-get clean || true
          docker system prune -af 2>/dev/null || true
          df -h / | tail -1

      - name: repo_sync
        run: |
          mkdir -p workspace && cd workspace
          ok=0
          for i in 1 2 3; do
            echo "repo init/sync attempt $i"
            if repo init -u https://github.com/OnePlusOSS/kernel_manifest.git \
                 -b "$MANIFEST_BRANCH" -m "$MANIFEST" \
                 --repo-rev=v2.16 --depth=1 --no-clone-bundle --no-tags \
               && repo sync -c -j"$(nproc)" --no-clone-bundle --no-tags --force-sync --fail-fast; then
              ok=1; break
            fi
            sleep 5
          done
          test "$ok" = "1" || { echo "ERROR: repo sync failed"; exit 1; }
          df -h / | tail -1
          grep -q "SUBLEVEL = 118" kernel_platform/common/Makefile \
            || { echo "ERROR: common is not 6.6.118"; exit 1; }
          echo "common tree is 6.6.118 ok"
          # strip the protected-exports list exactly like the reference flow does
          for dir in kernel_platform/common kernel_platform/msm-kernel; do
            if [ -e "$dir/BUILD.bazel" ]; then
              sed -i '/^[[:space:]]*"protected_exports_list"[[:space:]]*:[[:space:]]*"android\/abi_gki_protected_exports_aarch64",$/d' "$dir/BUILD.bazel"
            fi
            rm -f "$dir/android/abi_gki_protected_exports_"* 2>/dev/null || true
          done

      - name: setup_sukisu
        run: |
          cd workspace/kernel_platform
          # setup.sh clones SukiSU-Ultra into ./KernelSU and symlinks it into
          # drivers/kernelsu. It auto-detects common/drivers vs drivers, so run it
          # from kernel_platform and let it pick the right tree.
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" \
            | bash -s main || { echo "ERROR: SukiSU setup.sh failed"; exit 1; }
          echo "--- where did it land? ---"
          ls -la KernelSU 2>/dev/null | head -3 || true
          ls -la common/drivers/kernelsu 2>/dev/null || true
          ls -la msm-kernel/drivers/kernelsu 2>/dev/null || true
          KSUDIR=""
          for d in common/drivers/kernelsu msm-kernel/drivers/kernelsu; do
            if [ -f "$d/Kconfig" ]; then KSUDIR="$d"; break; fi
          done
          test -n "$KSUDIR" || { echo "ERROR: KernelSU was not wired into any tree"; exit 1; }
          echo "KSU wired into: $KSUDIR"
          echo "KSUDIR=$KSUDIR" >> "$GITHUB_ENV"
          grep -n "config KSU$" "$KSUDIR/Kconfig" || { echo "ERROR: no KSU Kconfig"; exit 1; }
          KSU_VERSION=$(expr $(cd KernelSU && git rev-list --count main 2>/dev/null || echo 13000) + 37185)
          echo "KSU_VERSION=$KSU_VERSION" >> "$GITHUB_ENV"
          echo "KernelSU integration version: $KSU_VERSION"

      - name: setup_susfs
        if: ${{ inputs.ENABLE_SUSFS == true }}
        run: |
          cd workspace
          git clone --depth=1 -b "gki-${ANDROID_VERSION}-${KVERSION}" \
            https://gitlab.com/simonpunk/susfs4ksu.git || {
              echo "ERROR: clone susfs4ksu failed"; exit 1; }
          git clone --depth=1 https://github.com/SukiSU-Ultra/SukiSU_patch.git \
            || { echo "ERROR: clone SukiSU_patch failed"; exit 1; }
          test -f "susfs4ksu/kernel_patches/50_add_susfs_in_gki-${ANDROID_VERSION}-${KVERSION}.patch" \
            || { echo "ERROR: 50_add_susfs patch missing"; ls susfs4ksu/kernel_patches; exit 1; }

          echo "=== copy susfs sources into the GKI tree (common/) ==="
          cp -v susfs4ksu/kernel_patches/fs/*              kernel_platform/common/fs/
          cp -v susfs4ksu/kernel_patches/include/linux/*   kernel_platform/common/include/linux/
          cp -v "susfs4ksu/kernel_patches/50_add_susfs_in_gki-${ANDROID_VERSION}-${KVERSION}.patch" kernel_platform/common/
          cp -v SukiSU_patch/69_hide_stuff.patch           kernel_platform/common/
          test -f kernel_platform/common/fs/susfs.c \
            || { echo "ERROR: susfs.c not copied"; exit 1; }

          cd kernel_platform/common
          P50="50_add_susfs_in_gki-${ANDROID_VERSION}-${KVERSION}.patch"

          # Ace 5 Pro needs the same two fixups the reference flow applies: the hunk
          # header in the upstream patch does not match this tree, and the
          # trace/hooks/fs.h include does not exist here.
          echo "=== adjust the patch for this device ==="
          sed -i 's/-32,12 +32,38/-32,11 +32,37/g' "$P50"
          sed -i '/#include <trace\/hooks\/fs.h>/d' "$P50"

          echo "=== apply 69_hide_stuff.patch ==="
          patch -p1 -F 3 < 69_hide_stuff.patch || { echo "ERROR: 69_hide_stuff failed"; exit 1; }

          echo "=== apply 50_add_susfs_in_kernel ==="
          patch -p1 < "$P50" || echo "WARN: 50_add_susfs had rejects (continuing, will verify)"

          echo "=== apply manual hooks ==="
          cp -v ../../SukiSU_patch/hooks/scope_min_manual_hooks_v1.6.patch ./
          patch -p1 -F 3 < scope_min_manual_hooks_v1.6.patch \
            || echo "WARN: manual hooks patch had rejects"

          echo "=== verify wiring ==="
          grep -q "susfs" fs/namei.c      || { echo "ERROR: fs/namei.c has no susfs hook"; exit 1; }
          grep -q "susfs" fs/namespace.c  || { echo "ERROR: fs/namespace.c has no susfs hook"; exit 1; }
          grep -qE "CONFIG_KSU_SUSFS" fs/Makefile \
            || { echo "ERROR: fs/Makefile lacks the susfs.o rule"; exit 1; }
          echo "  OK: namei.c / namespace.c / fs/Makefile wired"
          echo "susfs integrated ok"

      - name: write_kernel_config
        run: |
          cd workspace/kernel_platform
          CFG=./common/arch/arm64/configs/gki_defconfig
          test -f "$CFG" || { echo "ERROR: $CFG not found"; exit 1; }
          echo "--- original tail ---"
          tail -5 "$CFG"
          echo "" >> "$CFG"
          echo "# ==== injected by ace5pro workflow ====" >> "$CFG"
          echo "CONFIG_KSU=y" >> "$CFG"
          if [ "${{ inputs.ENABLE_KPM }}" = "true" ]; then
            echo "CONFIG_KPM=y" >> "$CFG"
          fi
          if [ "${{ inputs.ENABLE_SUSFS }}" = "true" ]; then
            echo "CONFIG_KSU_SUSFS=y" >> "$CFG"
            echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y" >> "$CFG"
            echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> "$CFG"
            echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> "$CFG"
            echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y" >> "$CFG"
            echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y" >> "$CFG"
            echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> "$CFG"
            echo "CONFIG_KSU_SUSFS_SUS_OVERLAYFS=n" >> "$CFG"
            echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y" >> "$CFG"
            echo "CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y" >> "$CFG"
            echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> "$CFG"
            echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> "$CFG"
            echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" >> "$CFG"
            echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y" >> "$CFG"
            echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> "$CFG"
            echo "CONFIG_KSU_SUSFS_SUS_SU=n" >> "$CFG"
            echo "CONFIG_KSU_MANUAL_HOOK=y" >> "$CFG"
          fi
          # the release string must stay byte-identical to stock or vendor_dlkm fails
          echo "CONFIG_LOCALVERSION_AUTO=n" >> "$CFG"
          echo "s/${{ inputs.KERNEL_LOCALVERSION }}/${{ inputs.KERNEL_LOCALVERSION }}/" > /dev/null
          # replace the -4k suffix produced by the tree with the full stock suffix
          sed -i "s|-4k|${{ inputs.KERNEL_LOCALVERSION }}|g" "$CFG"
          # check_defconfig rejects any change to the shipped defconfig; drop it
          sudo sed -i 's/check_defconfig//' ./common/build.config.gki
          echo "--- resulting tail ---"
          tail -25 "$CFG"

      - name: apply_hmbird_fix
        if: ${{ inputs.ENABLE_HMBIRD_FIX == true }}
        run: |
          # The Ace 5 Pro device tree advertises HMBIRD_OGKI; a GKI kernel built here
          # only accepts HMBIRD_GKI. Without this early_initcall the kernel gives up
          # very early and the device reboots (logo shown, then black).
          cd workspace/kernel_platform/common/drivers
          # written as base64 to keep the YAML/heredoc indentation out of the C source
          base64 -d > hmbird_patch.c <<'CEOF'
           I2luY2x1ZGUgPGxpbnV4L2luaXQuaD4KI2luY2x1ZGUgPGxpbnV4L21vZHVsZS5oPgojaW5jbHVk
           ZSA8bGludXgvb2YuaD4KI2luY2x1ZGUgPGxpbnV4L3NsYWIuaD4KI2luY2x1ZGUgPGxpbnV4L3N0
           cmluZy5oPgoKc3RhdGljIGludCBfX2luaXQgaG1iaXJkX3BhdGNoX2luaXQodm9pZCkKewogICAg
           c3RydWN0IGRldmljZV9ub2RlICp2ZXJfbnA7CiAgICBjb25zdCBjaGFyICp0eXBlOwogICAgc3Ry
           dWN0IHByb3BlcnR5ICpwcm9wLCAqbmV3X3Byb3A7CiAgICBpbnQgcmV0OwoKICAgIHZlcl9ucCA9
           IG9mX2ZpbmRfbm9kZV9ieV9wYXRoKCIvc29jL29wbHVzLGhtYmlyZC92ZXJzaW9uX3R5cGUiKTsK
           ICAgIGlmICghdmVyX25wKSB7CiAgICAgICAgcHJfaW5mbygiaG1iaXJkX3BhdGNoOiB2ZXJzaW9u
           X3R5cGUgbm9kZSBub3QgZm91bmRcbiIpOwogICAgICAgIHJldHVybiAwOwogICAgfQogICAgcmV0
           ID0gb2ZfcHJvcGVydHlfcmVhZF9zdHJpbmcodmVyX25wLCAidHlwZSIsICZ0eXBlKTsKICAgIGlm
           IChyZXQpIHsKICAgICAgICBwcl9pbmZvKCJobWJpcmRfcGF0Y2g6IHR5cGUgcHJvcGVydHkgbm90
           IGZvdW5kXG4iKTsKICAgICAgICBvZl9ub2RlX3B1dCh2ZXJfbnApOwogICAgICAgIHJldHVybiAw
           OwogICAgfQogICAgaWYgKHN0cmNtcCh0eXBlLCAiSE1CSVJEX09HS0kiKSkgewogICAgICAgIG9m
           X25vZGVfcHV0KHZlcl9ucCk7CiAgICAgICAgcmV0dXJuIDA7CiAgICB9CiAgICBwcm9wID0gb2Zf
           ZmluZF9wcm9wZXJ0eSh2ZXJfbnAsICJ0eXBlIiwgTlVMTCk7CiAgICBpZiAocHJvcCkgewogICAg
           ICAgIG5ld19wcm9wID0ga21hbGxvYyhzaXplb2YoKm5ld19wcm9wKSwgR0ZQX0tFUk5FTCk7CiAg
           ICAgICAgaWYgKCFuZXdfcHJvcCkgewogICAgICAgICAgICBvZl9ub2RlX3B1dCh2ZXJfbnApOwog
           ICAgICAgICAgICByZXR1cm4gMDsKICAgICAgICB9CiAgICAgICAgbWVtY3B5KG5ld19wcm9wLCBw
           cm9wLCBzaXplb2YoKnByb3ApKTsKICAgICAgICBuZXdfcHJvcC0+dmFsdWUgPSBrbWFsbG9jKHN0
           cmxlbigiSE1CSVJEX0dLSSIpICsgMSwgR0ZQX0tFUk5FTCk7CiAgICAgICAgaWYgKCFuZXdfcHJv
           cC0+dmFsdWUpIHsKICAgICAgICAgICAga2ZyZWUobmV3X3Byb3ApOwogICAgICAgICAgICBvZl9u
           b2RlX3B1dCh2ZXJfbnApOwogICAgICAgICAgICByZXR1cm4gMDsKICAgICAgICB9CiAgICAgICAg
           c3RyY3B5KG5ld19wcm9wLT52YWx1ZSwgIkhNQklSRF9HS0kiKTsKICAgICAgICBuZXdfcHJvcC0+
           bGVuZ3RoID0gc3RybGVuKCJITUJJUkRfR0tJIikgKyAxOwogICAgICAgIGlmIChvZl9yZW1vdmVf
           cHJvcGVydHkodmVyX25wLCBwcm9wKSAhPSAwKSB7CiAgICAgICAgICAgIG9mX25vZGVfcHV0KHZl
           cl9ucCk7CiAgICAgICAgICAgIHJldHVybiAwOwogICAgICAgIH0KICAgICAgICBpZiAob2ZfYWRk
           X3Byb3BlcnR5KHZlcl9ucCwgbmV3X3Byb3ApICE9IDApIHsKICAgICAgICAgICAgb2Zfbm9kZV9w
           dXQodmVyX25wKTsKICAgICAgICAgICAgcmV0dXJuIDA7CiAgICAgICAgfQogICAgICAgIHByX2lu
           Zm8oImhtYmlyZF9wYXRjaDogSE1CSVJEX09HS0kgLT4gSE1CSVJEX0dLSSBva1xuIik7CiAgICB9
           CiAgICBvZl9ub2RlX3B1dCh2ZXJfbnApOwogICAgcmV0dXJuIDA7Cn0KZWFybHlfaW5pdGNhbGwo
           aG1iaXJkX3BhdGNoX2luaXQpOwpNT0RVTEVfTElDRU5TRSgiR1BMIik7Ck1PRFVMRV9ERVNDUklQ
           VElPTigiRm9yY2VmdWxseSBjb252ZXJ0IEhNQklSRF9PR0tJIHRvIEhNQklSRF9HS0kuIik7
          CEOF
          grep -q "hmbird_patch.o" Makefile || echo "obj-y += hmbird_patch.o" >> Makefile
          echo "hmbird_patch.c installed"

      - name: set_release_string
        run: |
          # scripts/setlocalversion appends an scm tail; stock has none, so replace it
          KDIR="workspace/kernel_platform/common"
          SL="$KDIR/scripts/setlocalversion"
          test -f "$SL" || { echo "ERROR: $SL missing"; exit 1; }
          echo "--- original tail ---"
          tail -8 "$SL"
          sed -i 's/${scm_version}//' "$SL"
          echo "--- patched tail ---"
          tail -8 "$SL"
          grep -q '\${scm_version}' "$SL" && { echo "ERROR: scm_version still present"; exit 1; } || true
          echo "--- CONFIG_LOCALVERSION in defconfig ---"
          grep -n "CONFIG_LOCALVERSION" "$KDIR/arch/arm64/configs/gki_defconfig" || true

      - name: build_kernel
        if: ${{ !inputs.DRY_RUN }}
        run: |
          cd workspace/kernel_platform
          CLANG_DIR=prebuilts/clang/host/linux-x86/clang-r510928
          if [ ! -x "$CLANG_DIR/bin/clang" ]; then
            for d in prebuilts/clang/host/linux-x86/clang-*; do
              if [ -x "$d/bin/clang" ] && [ -x "$d/bin/ld.lld" ]; then CLANG_DIR="$d"; break; fi
            done
          fi
          echo "clang: $CLANG_DIR"
          test -x "$CLANG_DIR/bin/clang" || { echo "ERROR: no usable clang prebuilt"; exit 1; }
          RELCLANG=$(cd "$CLANG_DIR" && pwd -P)
          export PATH="$RELCLANG/bin:$PATH"
          export PATH="/usr/lib/ccache:$PATH"
          for tb in prebuilts/build-tools/path/linux-x86 prebuilts/kernel-build-tools/path/linux-x86; do
            [ -d "$PWD/$tb" ] && export PATH="$PWD/$tb:$PATH"
          done
          clang --version | head -1
          ld.lld --version | head -1

          # build timestamp must not change the vermagic, but a fixed epoch keeps the
          # banner stable between runs
          export SOURCE_DATE_EPOCH=$(date -u -d "2025-12-05 02:05:55" +%s)
          export KBUILD_BUILD_TIMESTAMP="Fri Dec  5 02:05:55 UTC 2025"

          PLAT="$PWD"
          RUSTC="$PLAT/prebuilts/rust/linux-x86/1.73.0b/bin/rustc"
          PAHOLE="$PLAT/prebuilts/kernel-build-tools/linux-x86/bin/pahole"
          [ -x "$RUSTC" ] || RUSTC=""
          [ -x "$PAHOLE" ] || PAHOLE="$(command -v pahole || true)"

          cd "$PLAT/common"
          echo "=== building common (the GKI tree) ==="
          set +e
          make -j"$(nproc --all)" LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            CC=clang LD=ld.lld HOSTLD=ld.lld \
            ${RUSTC:+RUSTC=$RUSTC} ${PAHOLE:+PAHOLE=$PAHOLE} \
            O=out KCFLAGS+=-O2 gki_defconfig all 2>&1 | tee /tmp/build.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "make exit=$rc"
          if [ "$rc" != "0" ]; then
            echo "--- errors ---"
            grep -E "error:|Error [0-9]" /tmp/build.log | head -30
            exit 1
          fi
          IMG=out/arch/arm64/boot/Image
          test -s "$IMG" || { echo "ERROR: Image not produced"; ls -la out/arch/arm64/boot/ 2>/dev/null; exit 1; }
          echo "Image: $IMG ($(stat -c%s "$IMG") bytes)"
          echo "--- release string ---"
          strings -n 12 "$IMG" | grep -m1 '^Linux version ' || true

      - name: verify_gki_config
        if: ${{ !inputs.DRY_RUN }}
        run: |
          CFG=workspace/kernel_platform/common/out/.config
          test -s "$CFG" || { echo "ERROR: .config missing"; exit 1; }
          KR=$(strings -n 12 workspace/kernel_platform/common/out/arch/arm64/boot/Image | grep -m1 '^Linux version ')
          echo "banner: $KR"
          case "$KR" in
            *6.6.118-android15-8*) ;;
            *) echo "ERROR: release is not 6.6.118-android15-8"; exit 1 ;;
          esac
          case "$KR" in
            *"${{ inputs.KERNEL_LOCALVERSION }}"*) ;;
            *) echo "ERROR: release does not carry the stock suffix"; exit 1 ;;
          esac
          case "$KR" in
            *+) echo "ERROR: dangling '+' in release"; exit 1 ;;
          esac

          echo "--- required symbols ---"
          grep -qE "^CONFIG_KSU=y"        "$CFG" || { echo "ERROR: CONFIG_KSU missing"; exit 1; }
          if [ "${{ inputs.ENABLE_KPM }}" = "true" ]; then
            grep -qE "^CONFIG_KPM=y"      "$CFG" || { echo "ERROR: CONFIG_KPM missing"; exit 1; }
          fi
          if [ "${{ inputs.ENABLE_SUSFS }}" = "true" ]; then
            grep -qE "^CONFIG_KSU_SUSFS=y" "$CFG" || { echo "ERROR: CONFIG_KSU_SUSFS missing"; exit 1; }
          fi
          grep -qE "^CONFIG_ARM64_4K_PAGES=y" "$CFG" || { echo "ERROR: not 4K pages"; exit 1; }
          echo "--- forbiddden vendor symbols (must be absent from a GKI kernel) ---"
          for s in CONFIG_ARCH_SUN CONFIG_ARM_SMMU CONFIG_COMMON_CLK_QCOM; do
            if grep -qE "^$s=[ym]" "$CFG"; then echo "ERROR: $s enabled"; exit 1; fi
          done
          MODS=$(grep -cE '^CONFIG_[A-Za-z0-9_]+=m$' "$CFG" || true)
          echo "module count: $MODS"
          test "$MODS" -lt 150 || { echo "ERROR: $MODS modules, vendor fragment leaked"; exit 1; }
          echo "gki config verify ok"

      - name: kernel_patch
        if: ${{ !inputs.DRY_RUN && inputs.ENABLE_KERNEL_PATCH == true }}
        run: |
          # SukiSU's KernelPatch binary pass injects the hook table the manager uses.
          cd workspace/kernel_platform/common/out/arch/arm64/boot
          cp Image Image.pre_patch
          curl -fL -o patch_linux \
            https://github.com/SukiSU-Ultra/SukiSU_KernelPatch_patch/releases/latest/download/patch_linux \
            || { echo "ERROR: could not download patch_linux"; exit 1; }
          chmod +x patch_linux
          ls -la patch_linux
          set +e
          ./patch_linux 2>&1 | tail -30
          prc=${PIPESTATUS[0]}
          set -e
          echo "patch_linux exit=$prc"
          if [ -f oImage ]; then
            echo "oImage produced ($(stat -c%s oImage) bytes)"
            mv -f Image Image.orig_kernel
            mv -f oImage Image
            echo "swapped in the patched kernel"
          else
            echo "WARN: patch_linux produced no oImage; keeping the unpatched Image"
            mv -f Image.pre_patch Image 2>/dev/null || true
          fi
          ls -la
          strings -n 12 Image | grep -m1 '^Linux version ' || true

      - name: package_ak3
        if: ${{ !inputs.DRY_RUN }}
        run: |
          cd workspace/kernel_platform/common/out/arch/arm64/boot
          test -s Image || { echo "ERROR: Image missing"; exit 1; }
          cd "$GITHUB_WORKSPACE"
          rm -rf /tmp/ak3
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git /tmp/ak3
          cp workspace/kernel_platform/common/out/arch/arm64/boot/Image /tmp/ak3/Image
          AK=/tmp/ak3/anykernel.sh
          test -f "$AK" || { echo "ERROR: anykernel.sh missing"; exit 1; }

          # device + slot wiring for PKR110 (A/B, boot holds no ramdisk)
          sed -i -E 's|^[[:space:]]*BLOCK=.*|BLOCK=/dev/block/bootdevice/by-name/boot;|' "$AK"
          sed -i -E 's|^[[:space:]]*IS_SLOT_DEVICE=.*|IS_SLOT_DEVICE=1;|' "$AK"
          sed -i 's|^device\.name1=.*|device.name1=sun|' "$AK"
          sed -i 's|^device\.name2=.*|device.name2=PKR110|' "$AK"
          sed -i 's|^device\.name3=.*|device.name3=OP60EBL1|' "$AK"
          sed -i 's|^device\.name4=.*|device.name4=|' "$AK"
          sed -i 's|^device\.name5=.*|device.name5=|' "$AK"
          sed -i "s|^kernel\.string=.*|kernel.string=Ace5Pro PKR110 6.6.118 SukiSU+SUSFS+KPM (${SHORT_SHA})|" "$AK"

          # boot has no ramdisk: split_boot + flash_boot instead of dump/write
          sed -i -E 's|^[[:space:]]*dump_boot;.*$|split_boot; # no ramdisk on boot|' "$AK"
          sed -i -E 's|^[[:space:]]*write_boot;.*$|flash_boot; # write kernel back|' "$AK"
          # the template ships Galaxy Nexus (tuna) tweaks that would corrupt the ramdisk
          for pat in 'backup_file init\.rc;' 'replace_string init\.rc' 'backup_file init\.tuna\.rc;' \
                     'insert_line init\.tuna\.rc' 'append_file init\.tuna\.rc' \
                     'backup_file fstab\.tuna;' 'patch_fstab fstab\.tuna' 'append_file fstab\.tuna'; do
            sed -i -E "s|^([[:space:]]*)($pat)|#\1\2|" "$AK"
          done

          echo "--- anykernel.sh key lines ---"
          grep -nE 'IS_SLOT_DEVICE|^BLOCK=|device\.name[1-5]|kernel\.string' "$AK" | head -12
          grep -qE '^[[:space:]]*split_boot;' "$AK" || { echo "ERROR: split_boot not active"; exit 1; }
          grep -qE '^[[:space:]]*flash_boot;' "$AK" || { echo "ERROR: flash_boot not active"; exit 1; }
          if grep -qE '^[[:space:]]*(dump_boot|write_boot);' "$AK"; then
            echo "ERROR: dump_boot/write_boot still active"; exit 1
          fi

          mkdir -p /tmp/artifact
          ZIP="AnyKernel3-ace5pro-sun-6.6.118-SukiSU-SUSFS-KPM-${SHORT_SHA}.zip"
          cd /tmp/ak3
          zip -r9 "/tmp/artifact/$ZIP" . -x '.git/*' '**/.git/*' '*.zip' '**/*.zip' \
            || { echo "ERROR: zip failed"; exit 1; }
          unzip -l "/tmp/artifact/$ZIP" | grep -q 'Image' || { echo "ERROR: Image not in zip"; exit 1; }
          unzip -l "/tmp/artifact/$ZIP" | grep -q 'anykernel.sh' || { echo "ERROR: anykernel.sh not in zip"; exit 1; }
          echo "ak3 packaged: $ZIP"

      - name: build_boot_img
        if: ${{ !inputs.DRY_RUN }}
        run: |
          # Wrap the kernel in a stock-shaped Android boot header v4 so it can also be
          # flashed with `fastboot flash boot` without AK3 running on the device.
          IMG=workspace/kernel_platform/common/out/arch/arm64/boot/Image
          test -s "$IMG" || { echo "ERROR: Image missing"; exit 1; }
          KSIZE=$(stat -c%s "$IMG")
          MAGIC=$(od -An -tx1 -j56 -N4 "$IMG" | tr -d ' \n')
          echo "kernel: $IMG ($KSIZE bytes) magic@0x38=$MAGIC"
          [ "$MAGIC" = "41524d64" ] || { echo "ERROR: not a raw arm64 Image"; exit 1; }

          mkdir -p /tmp/artifact
          BOOTIMG=/tmp/artifact/boot_ace5pro_sun_sukisu_susfs_kpm.img
          HDR=/tmp/boot_hdr.bin
          rm -f "$HDR" "$BOOTIMG"
          dd if=/dev/zero of="$HDR" bs=1 count=1584 status=none
          printf 'ANDROID!' | dd of="$HDR" bs=1 seek=0 conv=notrunc status=none

          echo_u32le() {
            v=$1; o=$2; fl=$3
            b0=$(( v         & 255 )); b1=$(( (v >>  8) & 255 ))
            b2=$(( (v >> 16) & 255 )); b3=$(( (v >> 24) & 255 ))
            o0=$(printf '%03o' "$b0"); o1=$(printf '%03o' "$b1")
            o2=$(printf '%03o' "$b2"); o3=$(printf '%03o' "$b3")
            printf "\\$o0\\$o1\\$o2\\$o3" | dd of="$fl" bs=1 seek="$o" conv=notrunc status=none
          }
          echo_u32le "$KSIZE" 8  "$HDR"
          echo_u32le 0       12  "$HDR"
          echo_u32le 0       16  "$HDR"
          echo_u32le 1584    20  "$HDR"
          echo_u32le 4       40  "$HDR"
          echo_u32le 0       1580 "$HDR"

          dd if=/dev/zero of=/tmp/boot_pad.bin bs=1 count=2512 status=none
          cat "$HDR" /tmp/boot_pad.bin "$IMG" > "$BOOTIMG"

          SZ=$(stat -c%s "$BOOTIMG")
          echo "--- boot.img check ---"
          echo "  size          : $SZ (expected $((4096 + KSIZE)))"
          [ "$SZ" = "$((4096 + KSIZE))" ] || { echo "ERROR: size mismatch"; exit 1; }
          read_ks=$(od -An -tu4 -j8    -N4 "$BOOTIMG" | tr -d ' ')
          read_hs=$(od -An -tu4 -j20   -N4 "$BOOTIMG" | tr -d ' ')
          read_hv=$(od -An -tu4 -j40   -N4 "$BOOTIMG" | tr -d ' ')
          read_sig=$(od -An -tu4 -j1580 -N4 "$BOOTIMG" | tr -d ' ')
          echo "  kernel_size   : $read_ks"
          echo "  header_size   : $read_hs"
          echo "  header_version: $read_hv"
          echo "  signature_size: $read_sig"
          [ "$read_ks" = "$KSIZE" ] || { echo "ERROR: kernel_size wrong"; exit 1; }
          [ "$read_hs" = "1584" ]   || { echo "ERROR: header_size wrong"; exit 1; }
          [ "$read_hv" = "4" ]      || { echo "ERROR: header_version wrong"; exit 1; }
          [ "$read_sig" = "0" ]     || { echo "ERROR: signature_size wrong"; exit 1; }
          kmagic=$(od -An -tx1 -j$((4096 + 56)) -N4 "$BOOTIMG" | tr -d ' \n')
          [ "$kmagic" = "41524d64" ] || { echo "ERROR: kernel payload magic wrong"; exit 1; }
          REL=$(strings -n 12 "$BOOTIMG" | grep -m1 '^Linux version ')
          echo "  release       : ${REL:-(not found)}"
          [ -n "$REL" ] || { echo "ERROR: no banner"; exit 1; }
          echo "boot.img ok"
          ls -l /tmp/artifact

      - name: upload_artifact
        if: ${{ !inputs.DRY_RUN }}
        uses: actions/upload-artifact@v4
        with:
          name: ace5pro-sun-6.6.118-SukiSU-SUSFS-KPM-${{ env.SHORT_SHA }}
          path: |
            /tmp/artifact/*.zip
            /tmp/artifact/*.img
          if-no-files-found: error
