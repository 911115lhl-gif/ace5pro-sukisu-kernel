name: ace5pro-b16-sukisu-susfs-kpm

on:
  workflow_dispatch:
    inputs:
      CPU:
        description: "platform (only sm8750)"
        required: true
        default: "sm8750"
        type: choice
        options:
          - sm8750
      FEIL:
        description: "manifest target (only oneplus_ace5_pro_b)"
        required: true
        default: "oneplus_ace5_pro_b"
        type: choice
        options:
          - oneplus_ace5_pro_b
      CPUD:
        description: "device codename (sun)"
        required: true
        default: "sun"
      BUILD_VARIANT:
        description: "build variant (perf matches stock)"
        required: true
        default: "perf"
        type: choice
        options:
          - perf
      ENABLE_KPM:
        description: "enable KPM"
        required: true
        default: true
        type: boolean
      ENABLE_SUSFS:
        description: "enable SUSFS"
        required: true
        default: true
        type: boolean
      LOCALVERSION:
        description: "CONFIG_LOCALVERSION (keep stock, do not change)"
        required: true
        default: "-g93e223c276e7-abogki500782043-4k"
      DRY_RUN:
        description: "dry-run verify only (no real build)"
        required: true
        default: false
        type: boolean

concurrency:
  group: ace5pro-b16-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      MANIFEST: oneplus_ace5_pro_b.xml
      MANIFEST_BRANCH: oneplus/sm8750
      TARGET: sun
      BUILD_VARIANT_NAME: ${{ inputs.BUILD_VARIANT }}
      GKI_VER_EXPECT: "6.6.118-android15-8"

    steps:
      - name: guard_params
        run: |
          set -e
          [ "${{ inputs.CPU }}" = "sm8750" ] || { echo "ERROR: CPU must be sm8750"; exit 1; }
          [ "${{ inputs.FEIL }}" = "oneplus_ace5_pro_b" ] || { echo "ERROR: FEIL must be oneplus_ace5_pro_b"; exit 1; }
          [ "${{ inputs.CPUD }}" = "sun" ] || { echo "ERROR: CPUD must be sun"; exit 1; }
          [ "${{ inputs.BUILD_VARIANT }}" = "perf" ] || { echo "ERROR: BUILD_VARIANT must be perf"; exit 1; }
          echo "commit=${GITHUB_SHA}"
          echo "SHORT_SHA=${GITHUB_SHA::8}" >> "$GITHUB_ENV"
          echo "guard ok"

      - name: install_repo
        run: |
          # repo/git need an identity on a fresh runner, otherwise repo sync fails with
          # "Please tell me who you are".
          git config --global user.name "ci-builder" || true
          git config --global user.email "ci-builder@localhost" || true
          git config --global --add safe.directory '*' || true
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          echo "--- disk before cleanup ---"
          df -h / | tail -1

      - name: free_disk_space
        run: |
          echo "=== reclaiming runner disk (this manifest is large: prebuilts + vendor tree) ==="
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo rm -rf /usr/local/share/boost /usr/share/swift 2>/dev/null || true
          sudo apt-get clean || true
          docker system prune -af 2>/dev/null || true
          echo "=== installing build deps (dtc needed by kbuild, bc/zip/unzip for packaging) ==="
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq device-tree-compiler bc bison flex zip unzip libssl-dev libelf-dev || true
          echo "--- dtc ---"
          command -v dtc && dtc --version || echo "dtc still missing (Image can still be built)"
          echo "--- disk after cleanup ---"
          df -h / | tail -1
          FREE_G=$(df -Pk / | awk 'NR==2 {print int($4/1024/1024)}')
          echo "free=${FREE_G}G"
          if [ "$FREE_G" -lt 12 ]; then echo "WARNING: less than 12G free, repo sync may fail"; fi

      - name: repo_sync
        run: |
          mkdir -p workspace && cd workspace
          repo init -u https://github.com/OnePlusOSS/kernel_manifest.git \
                    -b "$MANIFEST_BRANCH" -m "$MANIFEST" --depth=1
          ok=0
          for i in 1 2 3; do
            echo "repo sync attempt $i"
            if repo sync -c -j"$(nproc)" --fail-fast --force-sync; then
              ok=1
              break
            fi
            echo "sync failed, retry in 5s"
            sleep 5
          done
          if [ "$ok" != "1" ]; then echo "ERROR: repo sync failed after 3 attempts"; exit 1; fi
          echo "--- disk after sync ---"
          df -h / | tail -1
          grep -q "SUBLEVEL = 118" kernel_platform/common/Makefile || { echo "ERROR: common not 6.6.118"; exit 1; }
          grep -q "SUBLEVEL = 118" kernel_platform/msm-kernel/Makefile || { echo "ERROR: msm-kernel not 6.6.118"; exit 1; }
          echo "source is 6.6.118 ok"

      - name: check_toolchain
        run: |
          cd workspace/kernel_platform
          echo "=== clang prebuilts (needed by legacy make path) ==="
          ls -d prebuilts/clang/host/linux-x86/clang-* 2>/dev/null || echo "no clang prebuilt dir"
          echo "=== build tools present? ==="
          ls -d prebuilts/build-tools prebuilts/kernel-build-tools 2>/dev/null || echo "none"
          echo "=== host toolchain ==="
          gcc --version | head -1 || true
          make --version | head -1 || true
          python3 --version || true

      - name: apply_sukisu
        run: |
          git clone --depth=1 https://github.com/SukiSU-Ultra/SukiSU-Ultra.git /tmp/sukisu
          cd workspace/kernel_platform/msm-kernel
          bash /tmp/sukisu/kernel/setup.sh || { echo "ERROR: sukisu setup.sh failed"; exit 1; }
          find . -name 'allowlist.c' | grep -q . || { echo "ERROR: allowlist.c not found, sukisu kernel not integrated"; exit 1; }
          echo "sukisu integrated ok"

      - name: apply_susfs
        if: ${{ inputs.ENABLE_SUSFS == true }}
        run: |
          # Follows the official susfs4ksu README "Apply SUSFS patches" steps 3-10:
          #   3/6 copy patch+fs+include into tree, 7 patch KernelSU (this is what
          #   defines CONFIG_KSU_SUSFS in KernelSU/kernel/Kconfig), 8 patch kernel.
          git clone --depth=1 -b gki-android15-6.6 https://github.com/ShirkNeko/susfs4ksu.git /tmp/susfs
          KDIR="workspace/kernel_platform/msm-kernel"
          ls /tmp/susfs/kernel_patches

          echo "=== step 5/6: copy fs/ and include/linux/ sources into kernel tree ==="
          cp -v /tmp/susfs/kernel_patches/fs/* "$KDIR/fs/" || { echo "ERROR: copy fs failed"; exit 1; }
          cp -v /tmp/susfs/kernel_patches/include/linux/* "$KDIR/include/linux/" || { echo "ERROR: copy include failed"; exit 1; }
          ls -l "$KDIR/fs/susfs.c" "$KDIR/include/linux/susfs.h" "$KDIR/include/linux/susfs_def.h" || { echo "ERROR: susfs sources missing"; exit 1; }

          echo "=== step 7: patch KernelSU with 10_enable_susfs_for_ksu.patch ==="
          KSU_DIR=$(dirname "$(find "$KDIR" -name 'allowlist.c' -print -quit 2>/dev/null)")
          echo "KSU_DIR=$KSU_DIR"
          if [ -z "$KSU_DIR" ] || [ "$KSU_DIR" = "." ]; then echo "ERROR: cannot locate KernelSU dir"; exit 1; fi
          KSU_ROOT=$(cd "$KSU_DIR/.." && pwd)
          echo "KSU_ROOT=$KSU_ROOT"
          cp -v /tmp/susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch "$KSU_ROOT/" || { echo "ERROR: copy ksu patch"; exit 1; }
          ( cd "$KSU_ROOT" && patch -p1 --forward < 10_enable_susfs_for_ksu.patch ) || echo "WARN: KernelSU patch had rejects (see .rej below)"

          echo "=== step 8: patch kernel tree with 50_add_susfs patch ==="
          P50=$(ls /tmp/susfs/kernel_patches/50_add_susfs_in_gki-android15-*.patch 2>/dev/null | head -1)
          echo "patch: $P50"
          ( cd "$KDIR" && git apply -p1 --reject "$P50" ) && echo "kernel patch applied clean" || echo "WARN: kernel patch had rejects"

          echo "=== rejects present? ==="
          find "$KDIR" "$KSU_ROOT" -name '*.rej' 2>/dev/null | head -40 || true

          echo "=== step 10: verify CONFIG_KSU_SUSFS now exists as a Kconfig symbol ==="
          grep -rn "config KSU_SUSFS" "$KSU_ROOT/kernel/Kconfig" 2>/dev/null | head -3 || {
            echo "ERROR: CONFIG_KSU_SUSFS not declared in KernelSU Kconfig"
            echo "--- KernelSU Kconfig files ---"
            find "$KSU_ROOT" -name 'Kconfig*' | head -10
            exit 1
          }
          echo "=== verify kernel hooks ==="
          grep -q "susfs" "$KDIR/fs/namei.c" && echo "OK namei.c" || { echo "ERROR: fs/namei.c has no susfs hook"; exit 1; }
          grep -q "susfs" "$KDIR/fs/namespace.c" && echo "OK namespace.c" || { echo "ERROR: fs/namespace.c has no susfs hook"; exit 1; }
          echo "=== kernel_patches/KernelSU patched files ==="
          ( cd "$KSU_ROOT" && git status --porcelain 2>/dev/null | head -20 ) || true
          echo "susfs integrated ok"

      - name: write_kernel_config
        run: |
          cd workspace/kernel_platform/msm-kernel
          CFG=arch/arm64/configs/vendor/sun_perf.config
          test -f "$CFG" || { echo "ERROR: $CFG not found"; ls arch/arm64/configs/vendor/ | head -20; exit 1; }
          echo "" >> "$CFG"
          echo "# ==== injected by ace5pro workflow ====" >> "$CFG"
          echo "CONFIG_KSU=y" >> "$CFG"
          if [ "${{ inputs.ENABLE_KPM }}" = "true" ]; then
            echo "CONFIG_KPM=y" >> "$CFG"
          else
            echo "# CONFIG_KPM is not set" >> "$CFG"
          fi
          if [ "${{ inputs.ENABLE_SUSFS }}" = "true" ]; then
            echo "CONFIG_KSU_SUSFS=y" >> "$CFG"
          else
            echo "# CONFIG_KSU_SUSFS is not set" >> "$CFG"
          fi
          echo "CONFIG_KALLSYMS_ALL=y" >> "$CFG"
          # device ships a 4K-page GKI kernel; stock vendor_dlkm modules are 4K
          echo "CONFIG_ARM64_4K_PAGES=y" >> "$CFG"
          echo "# CONFIG_ARM64_16K_PAGES is not set" >> "$CFG"
          echo "# CONFIG_ARM64_64K_PAGES is not set" >> "$CFG"
          # reproduce the stock release string so vendor modules load
          echo "CONFIG_LOCALVERSION_AUTO=n" >> "$CFG"
          echo "CONFIG_LOCALVERSION=\"${{ inputs.LOCALVERSION }}\"" >> "$CFG"
          echo "--- appended config ---"
          tail -14 "$CFG"

      - name: check_release_string_logic
        run: |
          # Root cause of the trailing "+": scripts/setlocalversion ends with
          #
          #   elif [ "${LOCALVERSION+set}" != "set" ]; then
          #       echo "+"            <-- this is the '+' we saw
          #   ...
          #   echo "${KERNELVERSION}${file_localversion}${config_localversion}${LOCALVERSION}${scm_version}"
          #
          # So the '+' appears when LOCALVERSION is UNSET in the make environment.
          # We must (a) keep setlocalversion intact (it produces the whole release
          # string, including KERNELVERSION) and (b) explicitly pass LOCALVERSION=""
          # to make so the UNSET branch is never taken.
          KDIR="workspace/kernel_platform/msm-kernel"
          SL="$KDIR/scripts/setlocalversion"
          test -f "$SL" || { echo "ERROR: $SL missing"; exit 1; }

          echo "=== confirm the '+' branch exists (do NOT modify the script) ==="
          grep -n -A2 'LOCALVERSION+set' "$SL" || true
          grep -n 'echo "+"' "$SL" || true
          if ! grep -q 'LOCALVERSION+set' "$SL"; then
            echo "WARNING: expected LOCALVERSION+set logic not found; check kernel version"
          fi
          echo "setlocalversion left untouched; LOCALVERSION will be forced to empty at make time"

      - name: build_kernel
        run: |
          cd workspace/kernel_platform
          echo "TARGET=$TARGET VARIANT=$BUILD_VARIANT_NAME"
          echo "=== legacy (non-bazel) build path ==="
          echo "--- build dirs ---"
          ls -la build/ 2>/dev/null | head -30 || echo "no build/"
          echo "--- candidate entry points ---"
          for f in build/build.sh build.sh common/build/build.sh msm-kernel/build/build.sh; do
            if [ -f "$f" ]; then echo "FOUND  $f"; else echo "absent $f"; fi
          done
          echo "--- clang prebuilt ---"
          ls -d prebuilts/clang/host/linux-x86/clang-* 2>/dev/null || echo "no clang prebuilt"
          echo "--- defconfig inputs ---"
          ls -l msm-kernel/arch/arm64/configs/gki_defconfig 2>/dev/null || echo "no msm-kernel/arch/arm64/configs/gki_defconfig"
          ls -l msm-kernel/arch/arm64/configs/vendor/sun_perf.config msm-kernel/arch/arm64/configs/vendor/sun_oplus_common.config 2>/dev/null || true
          echo "--- our injected config lines ---"
          tail -12 msm-kernel/arch/arm64/configs/vendor/sun_perf.config

          BUILD_OK=0
          if [ "${{ inputs.DRY_RUN }}" = "true" ]; then
            echo "=== DRY_RUN: discovery + patch checks only, no compile ==="
            BUILD_OK=1
          else
            if [ -f build/build.sh ]; then
              echo "=== PATH 1: ACK wrapper build/build.sh (BUILD_CONFIG=msm-kernel/build.config.msm.sun) ==="
              set +e
              ROOT_DIR=$PWD KERNEL_DIR=msm-kernel \
              BUILD_CONFIG=msm-kernel/build.config.msm.sun VARIANT="$BUILD_VARIANT_NAME" \
                ./build/build.sh 2>&1 | tee /tmp/legacy_build.log
              rc=${PIPESTATUS[0]}
              set -e
              echo "build.sh exit=$rc"
              if [ "$rc" = "0" ] && [ "$(find . -name Image -not -path './out_manual/*' 2>/dev/null | wc -l)" -gt 0 ]; then
                BUILD_OK=1
              else
                echo "--- last 40 lines of log ---"
                tail -40 /tmp/legacy_build.log
              fi
            else
              echo "PATH 1 not available (no build/build.sh)"
            fi

            if [ "$BUILD_OK" = "0" ]; then
              echo "=== PATH 2: manual make (gki_defconfig + sun fragments) ==="
              K=msm-kernel
              CFGDIR=$K/arch/arm64/configs
              OUT=$PWD/out_manual
              # honour build.config.constants CLANG_VERSION (e.g. r510928); the old
              # clang-3289846 has no ld.lld and breaks kconfig linking.
              CLANG_VER=$(sed -n 's/^CLANG_VERSION=//p' $K/build.config.constants 2>/dev/null | head -1)
              echo "CLANG_VERSION from build.config.constants: ${CLANG_VER:-<empty>}"
              CLANG_DIR=""
              if [ -n "$CLANG_VER" ] && [ -d "prebuilts/clang/host/linux-x86/clang-${CLANG_VER}" ]; then
                CLANG_DIR="prebuilts/clang/host/linux-x86/clang-${CLANG_VER}"
              else
                # fall back to any clang whose bin/ actually contains ld.lld
                for d in prebuilts/clang/host/linux-x86/clang-*; do
                  if [ -x "$d/bin/ld.lld" ] && [ -x "$d/bin/clang" ]; then CLANG_DIR="$d"; break; fi
                done
              fi
              echo "clang: $CLANG_DIR"
              if [ -z "$CLANG_DIR" ]; then
                echo "ERROR: no usable clang prebuilt (needs bin/clang + bin/ld.lld)"
                ls prebuilts/clang/host/linux-x86/ 2>/dev/null | head
                exit 1
              fi
              if [ ! -x "$CLANG_DIR/bin/ld.lld" ]; then
                echo "ERROR: $CLANG_DIR/bin/ld.lld missing"
                ls "$CLANG_DIR/bin" | grep -E '^(ld\.lld|clang|lld)$' || true
                exit 1
              fi
              export PATH="$PWD/$CLANG_DIR/bin:$PATH"
              # ACK ships host tools (dtc, etc.) under prebuilts/build-tools
              for tb in prebuilts/build-tools/path/linux-x86 prebuilts/kernel-build-tools/path/linux-x86; do
                if [ -d "$PWD/$tb" ]; then
                  export PATH="$PWD/$tb:$PATH"
                  echo "added build-tools: $tb"
                fi
              done
              export ARCH=arm64 LLVM=1 LLVM_IAS=1
              echo "--- tool sanity ---"
              command -v clang && clang --version | head -1
              command -v ld.lld && ld.lld --version | head -1
              command -v dtc && dtc --version || echo "WARNING: dtc not found (kernel may still build Image)"
              rm -rf "$OUT" && mkdir -p "$OUT"
              if [ ! -f "$CFGDIR/gki_defconfig" ]; then
                echo "ERROR: $CFGDIR/gki_defconfig not found"
                ls "$CFGDIR" | head -20
                exit 1
              fi
              make -C $K O=$OUT gki_defconfig
              test -s "$OUT/.config" || { echo "ERROR: gki_defconfig produced empty .config"; exit 1; }
              # NOTE: $PWD changes after cd, so freeze absolute paths into variables first.
              PLAT="$PWD"
              KDIR="$PLAT/$K"
              BASE_CFG="$OUT/.config"
              MERGE="$KDIR/scripts/kconfig/merge_config.sh"
              FRAGS="$KDIR/arch/arm64/configs/vendor/sun_perf.config"
              if [ -s "$KDIR/arch/arm64/configs/vendor/sun_oplus_common.config" ]; then
                FRAGS="$FRAGS $KDIR/arch/arm64/configs/vendor/sun_oplus_common.config"
              else
                echo "skip empty fragment sun_oplus_common.config"
              fi
              for frag in $FRAGS; do
                test -f "$frag" || { echo "ERROR: fragment not found: $frag"; exit 1; }
              done
              echo "base: $BASE_CFG"
              echo "fragments: $FRAGS"
              echo "merge script: $MERGE"
              test -f "$BASE_CFG" || { echo "ERROR: base config missing: $BASE_CFG"; exit 1; }
              test -f "$MERGE" || { echo "ERROR: merge_config.sh missing: $MERGE"; exit 1; }
              # merge_config.sh: with KCONFIG_CONFIG set, -O is ignored (it is only a
              # fallback for deriving KCONFIG_CONFIG), so we omit it. -m = don't run make.
              # Run it from the kernel dir so its internal relative paths resolve; the
              # script and config paths are pre-frozen absolute values.
              ( cd "$KDIR" && KCONFIG_CONFIG="$BASE_CFG" bash "$MERGE" -m -r -y "$BASE_CFG" $FRAGS ) \
                || { echo "ERROR: merge_config failed"; exit 1; }
              echo "--- merged .config size ---"
              wc -l "$BASE_CFG" || true
              make -C $K O=$OUT olddefconfig
              echo "--- resulting key configs ---"
              grep -E "^CONFIG_(KSU|KPM|KSU_SUSFS|ARM64_4K_PAGES|ARM64_16K_PAGES|LOCALVERSION)=" "$OUT/.config" || true
              # KSU must survive olddefconfig; if it vanished the Kconfig hook is missing
              if ! grep -qE "^CONFIG_KSU=[ym]" "$OUT/.config"; then
                echo "ERROR: CONFIG_KSU did not survive olddefconfig - SukiSU Kconfig hook missing"
                echo "--- is KSU Kconfig sourced anywhere? ---"
                grep -rn "kernelsu\|KernelSU\|sukisu" $K/Kconfig $K/drivers/Kconfig 2>/dev/null | head -5 || true
                echo "--- KSU files present in tree? ---"
                find $K -maxdepth 3 \( -iname '*kernelsu*' -o -iname 'allowlist.c' \) 2>/dev/null | head -5 || true
                echo "--- what setup.sh actually did ---"
                ls -la $K/KernelSU 2>/dev/null || echo "no $K/KernelSU dir"
                exit 1
              fi
              # Release string target:
              #   VERSION.PATCHLEVEL.SUBLEVEL + EXTRAVERSION + CONFIG_LOCALVERSION
              #   = 6.6.118 + -android15-8 + -g93e223c276e7-abogki500782043-4k
              # setlocalversion appends '+' ONLY when LOCALVERSION is unset, so export
              # it as an explicit empty string for both the make invocation and any
              # child shell that runs scripts/setlocalversion.
              export LOCALVERSION=
              echo "--- pre-build sanity ---"
              echo "LOCALVERSION is set to: '${LOCALVERSION}'"
              grep -E "^CONFIG_LOCALVERSION" "$OUT/.config" || true
              echo "--- predicted release string (make kernelrelease) ---"
              REL=$(make -C $K O=$OUT EXTRAVERSION=-android15-8 LOCALVERSION= kernelrelease 2>/dev/null | tail -1)
              echo "release = '$REL'"
              if [ -z "$REL" ]; then
                echo "ERROR: make kernelrelease returned nothing"
                exit 1
              fi
              case "$REL" in
                *+) echo "ERROR: predicted release still ends with '+'"; exit 1 ;;
              esac
              if ! echo "$REL" | grep -q "abogki500782043-4k"; then
                echo "ERROR: predicted release lacks the stock suffix"
                exit 1
              fi
              echo "predicted release OK"
              make -C $K O=$OUT -j"$(nproc)" EXTRAVERSION=-android15-8 LOCALVERSION= Image
              if [ -f "$OUT/arch/arm64/boot/Image" ]; then
                echo "manual build OK: $OUT/arch/arm64/boot/Image"
                echo "--- built release string ---"
                grep -a -o "Linux version [^ ]*" "$OUT/arch/arm64/boot/Image" | head -1 || true
                BUILD_OK=1
              else
                echo "ERROR: manual build produced no Image"
                exit 1
              fi
            fi
          fi

          if [ "$BUILD_OK" = "1" ]; then
            echo "=== build stage finished (BUILD_OK=1) ==="
          else
            echo "ERROR: no build path succeeded"
            exit 1
          fi

      - name: verify_artifact
        if: ${{ !inputs.DRY_RUN }}
        run: |
          cd workspace/kernel_platform
          IMG=$(find . -type f -name Image -path '*arch/arm64/boot/Image' 2>/dev/null | head -1)
          if [ -z "$IMG" ]; then IMG=$(find . -type f -name Image 2>/dev/null | head -1); fi
          echo "Image=$IMG"
          test -n "$IMG" && test -s "$IMG" || { echo "ERROR: Image missing"; exit 1; }
          grep -a "Linux version" "$IMG" | head -1
          grep -a "Linux version" "$IMG" | grep -q "${{ env.GKI_VER_EXPECT }}" || { echo "ERROR: not ${{ env.GKI_VER_EXPECT }}"; exit 1; }
          grep -a "Linux version" "$IMG" | grep -q "abogki500782043-4k" || { echo "ERROR: localversion mismatch"; exit 1; }
          # a trailing '+' means setlocalversion saw a dirty tree -> vermagic mismatch
          if grep -a -o "Linux version [^ ]*" "$IMG" | head -1 | grep -q -- '+'; then
            echo "ERROR: kernel release has a trailing '+' (dirty tree marker); vendor_dlkm modules would fail to load"
            grep -a -o "Linux version [^ ]*" "$IMG" | head -1
            exit 1
          fi
          echo "release string OK (no '+' suffix)"
          CFG=""
          for c in out_manual/.config dist/.config out/kernel-platform/.config; do
            if [ -s "$c" ]; then CFG="$c"; break; fi
          done
          if [ -z "$CFG" ]; then CFG=$(find . -type f -name .config -not -path './msm-kernel/*' -not -path './common/*' 2>/dev/null | head -1); fi
          echo "config=$CFG"
          test -n "$CFG" || { echo "ERROR: .config not found"; exit 1; }
          echo "--- key configs in $CFG ---"
          grep -E "^CONFIG_(KSU|KPM|KSU_SUSFS|ARM64_4K_PAGES|ARM64_16K_PAGES|LOCALVERSION)" "$CFG" || true
          # KSU may be builtin (y) or module (m); both mean SukiSU is present
          if ! grep -qE "^CONFIG_KSU=[ym]" "$CFG"; then
            echo "ERROR: CONFIG_KSU not set (SukiSU missing from kernel)"
            exit 1
          fi
          if [ "${{ inputs.ENABLE_KPM }}" = "true" ] && ! grep -qE "^CONFIG_KPM=y" "$CFG"; then
            echo "ERROR: CONFIG_KPM not enabled (KPM requested)"
            exit 1
          fi
          if [ "${{ inputs.ENABLE_SUSFS }}" = "true" ] && ! grep -qE "^CONFIG_KSU_SUSFS=y" "$CFG"; then
            echo "ERROR: CONFIG_KSU_SUSFS not enabled (SUSFS requested)"
            exit 1
          fi
          grep -qE "^CONFIG_ARM64=y" "$CFG" || { echo "ERROR: not arm64"; exit 1; }
          grep -qE "^CONFIG_ARM64_4K_PAGES=y" "$CFG" || { echo "ERROR: not 4k pages - WOULD BRICK DEVICE"; exit 1; }
          echo "artifact verify ok"

      - name: package_ak3
        if: ${{ !inputs.DRY_RUN }}
        run: |
          cd workspace/kernel_platform
          IMG=$(find . -type f -name Image -path '*arch/arm64/boot/Image' 2>/dev/null | head -1)
          if [ -z "$IMG" ]; then IMG=$(find . -type f -name Image 2>/dev/null | head -1); fi
          echo "packaging: $IMG"
          test -n "$IMG" && test -s "$IMG" || { echo "ERROR: Image missing/empty"; exit 1; }
          rm -rf /tmp/ak3
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git /tmp/ak3
          test -f /tmp/ak3/anykernel.sh || { echo "ERROR: anykernel.sh missing in template"; ls /tmp/ak3 | head; exit 1; }
          cp "$IMG" /tmp/ak3/Image
          echo "--- template slot settings BEFORE ---"
          grep -nE 'is_slot_device|^block=' /tmp/ak3/anykernel.sh || echo "(none found)"
          # A/B device: force slot-aware flashing. If the key is absent, insert it.
          if grep -qE '^is_slot_device=' /tmp/ak3/anykernel.sh; then
            sed -i 's/^is_slot_device=.*/is_slot_device=1;/' /tmp/ak3/anykernel.sh
          else
            sed -i '/^## AnyKernel setup end/a is_slot_device=1;' /tmp/ak3/anykernel.sh
          fi
          echo "--- template slot settings AFTER ---"
          grep -nE 'is_slot_device|^block=' /tmp/ak3/anykernel.sh || true
          grep -qE '^is_slot_device=1' /tmp/ak3/anykernel.sh || { echo "ERROR: failed to set is_slot_device=1"; exit 1; }
          cd /tmp/ak3
          ZIP="AnyKernel3-sun-sm8750-b16-SukiSU-SUSFS-KPM-${SHORT_SHA}.zip"
          zip -r9 "$ZIP" . -x '.git/*'
          mkdir -p /tmp/artifact && cp "$ZIP" /tmp/artifact/
          echo "--- zip contents ---"
          unzip -l "/tmp/artifact/$ZIP" | head -30
          # sanity: the kernel must be inside the zip
          unzip -l "/tmp/artifact/$ZIP" | grep -q 'Image' || { echo "ERROR: Image not in zip"; exit 1; }

      - name: upload_artifact
        if: ${{ !inputs.DRY_RUN }}
        uses: actions/upload-artifact@v4
        with:
          name: ace5pro-sun-b16-SukiSU-SUSFS-KPM-${{ env.SHORT_SHA }}
          path: /tmp/artifact/*.zip
